spring.application.name=api-workspace

# 1. Database Connection (Uses Environment Variables if available, otherwise defaults to your local database)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/api_workspace}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:changeme} 
# (Change the default password above if your local postgres password is not 'postgres')

# 2. Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. JWT Secret (Uses Environment Variable if available, otherwise defaults to a hardcoded string for local testing)
jwt.secret=${JWT_SECRET:f6ea1b717081baa2808dcec72478797aaac9c417bfea05453d1336b2f7462fcf}


