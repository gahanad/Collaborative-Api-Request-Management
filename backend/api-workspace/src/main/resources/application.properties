spring.application.name=api-workspace

# 1. Database Connection (Uses Environment Variables if available, otherwise defaults to your local database)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD} 
# (Change the default password above if your local postgres password is not 'postgres')

# 2. Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. JWT Secret (Uses Environment Variable if available, otherwise defaults to a hardcoded string for local testing)
jwt.secret=${JWT_SECRET}


